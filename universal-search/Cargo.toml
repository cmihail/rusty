[package]
name = "rusty-universal-search"
version = "0.1.0"
edition = "2021"

[dependencies]
dirs = "5.0.1"
gtk4 = "0.10"
glib = { version = "0.21", features = ["v2_66"] }
gdk4 = "0.10"
gio = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.0"
reqwest = { version = "0.11", features = ["json", "stream", "gzip"] }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
regex = "1.0"
async-channel = "2.0"
urlencoding = "2.1"

[build-dependencies]
glib-build-tools = "0.21"