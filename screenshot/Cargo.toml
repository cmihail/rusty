[package]
name = "rusty-screenshot"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = "0.10"
gtk4-layer-shell = "0.6"
glib = "0.21"
gdk4 = "0.10"
gio = "0.21"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["process", "rt", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.0"

[build-dependencies]
glib-build-tools = "0.21"