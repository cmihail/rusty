<?xml version="1.0" encoding="UTF-8"?>
<svg height="16px" viewBox="0 0 16 16" width="16px" xmlns="http://www.w3.org/2000/svg">
    <!-- Microphone body (capsule shape) -->
    <rect x="6" y="2" width="4" height="6" rx="2" ry="2" fill="currentColor"/>
    <!-- Microphone stand -->
    <path d="M 4 8 Q 4 11 8 11 Q 12 11 12 8" stroke="currentColor" stroke-width="1.5" fill="none"/>
    <line x1="8" y1="11" x2="8" y2="13" stroke="currentColor" stroke-width="1.5"/>
    <line x1="6" y1="13" x2="10" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Headset boom (small arc on right side to indicate headset mic) -->
    <path d="M 10 4 Q 12 4 12 6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="12" cy="6.5" r="0.8" fill="currentColor"/>
    <!-- Mute slash -->
    <path d="m 2 2 l 12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
